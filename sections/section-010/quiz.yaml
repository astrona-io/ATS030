# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats030-010
course_id: ATS030
exam_code: CKAD
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: section
  id: section-010
  title: Demonstrate basic understanding of NetworkPolicies
questions:
- id: ats030-010-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Explain when a pod becomes isolated
  source_readings:
  - sections/section-010/module-01/course-01-networkpolicy-and-allowed-connections.md
  prompt: 'The namespace `starfleet` has no NetworkPolicy. A new policy selects only
    pods labelled `app: probe` and lists `policyTypes: [Ingress]` with one ingress
    rule. What happens to a pod labelled `app: shuttle` in `starfleet`?'
  options:
  - id: a
    text: It becomes isolated for ingress, because every pod of the namespace is selected
      by the first policy.
    explanation: A policy isolates only the pods its `podSelector` selects.
  - id: b
    text: It keeps accepting every incoming connection, because no policy selects
      it.
    explanation: Correct. A pod is isolated for a direction only when a policy selects
      it for that direction. Pods that no policy selects keep the default of allowing
      all traffic.
  - id: c
    text: It stops making outgoing connections, because the policy covers both directions.
    explanation: The policy lists only `Ingress`, so it never affects egress.
  - id: d
    text: It is removed from the Service endpoints.
    explanation: NetworkPolicy never changes endpoints. It filters connections.
  correct_option: b
  explanation: A pod is isolated for ingress or egress only after a policy selects
    it for that direction. Unselected pods keep allowing all traffic.
- id: ats030-010-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain that policies are additive
  source_readings:
  - sections/section-010/module-01/course-01-networkpolicy-and-allowed-connections.md
  prompt: 'Two policies select the pods labelled `app: probe` for ingress. One allows
    connections from pods labelled `app: shuttle`. The other allows connections from
    pods labelled `app: drifter` in the same namespace. Which clients can connect?'
  options:
  - id: a
    text: Only pods that match both policies, so neither client.
    explanation: Policies are not intersected.
  - id: b
    text: Only the pod that was allowed by the policy created first.
    explanation: Creation order has no effect.
  - id: c
    text: Both `shuttle` and `drifter` pods, because the allowed traffic is the union
      of all rules of all selecting policies.
    explanation: Correct. Every selecting policy can only add allowed traffic.
  - id: d
    text: No client, because two policies on one pod conflict and block everything.
    explanation: Policies do not conflict. There is no deny rule.
  correct_option: c
  explanation: NetworkPolicy has allow rules only. The result for a pod is the union
    of every rule in every policy that selects it.
- id: ats030-010-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Write a default deny policy
  source_readings:
  - sections/section-010/module-03/course-01-default-deny-and-additive-policies.md
  prompt: Which spec closes a namespace for incoming connections and allows none?
  options:
  - id: a
    text: "`podSelector: {}` and `policyTypes: [Ingress]` with no `ingress` rules."
    explanation: Correct. The empty selector selects every pod, and no rule means
      nothing is allowed in.
  - id: b
    text: "`podSelector: {}` and an `ingress` list with one empty rule `- {}`."
    explanation: An empty rule allows all sources.
  - id: c
    text: 'No `podSelector` field and `policyTypes: [Ingress]`.'
    explanation: "`podSelector` is required. Omitting it makes the object invalid."
  - id: d
    text: "`policyTypes: [Egress]` with no `egress` rules."
    explanation: This closes outgoing connections, not incoming ones.
  correct_option: a
  explanation: An empty `podSelector` selects all pods in the namespace, and a direction
    with no rules allows nothing.
- id: ats030-010-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain why a default deny egress policy breaks name resolution
  source_readings:
  - sections/section-010/module-02/course-01-dns-and-service-discovery.md
  prompt: A default deny policy for egress is applied in `starfleet`. A client pod
    then runs `wget http://probe/` and fails at once with `bad address`. What is the
    cause?
  options:
  - id: a
    text: The `probe` Service was deleted by the policy.
    explanation: Policies never delete Services.
  - id: b
    text: The pod can no longer send DNS queries to cluster DNS on port 53, so the
      name does not resolve.
    explanation: Correct. Cluster DNS runs in `kube-system`. Egress to port 53 over
      UDP and TCP must be allowed in a separate rule.
  - id: c
    text: The pod lost its IP address when it became isolated.
    explanation: Isolation filters connections and does not change addresses.
  - id: d
    text: Egress policies apply only to HTTP.
    explanation: Policies work at layers 3 and 4 and apply to TCP, UDP and SCTP.
  correct_option: b
  explanation: Egress isolation also blocks DNS queries. Allow port 53 for UDP and
    TCP to the DNS pods, usually with a `namespaceSelector` for `kube-system`.
- id: ats030-010-q05
  type: single_choice
  difficulty: advanced
  learning_objective: Tell the AND form and the OR form of a from list apart
  source_readings:
  - sections/section-010/module-03/course-02-peer-selectors-ip-blocks-and-ports.md
  prompt: 'Which `from` list allows only the pod labelled `app: drifter` in the namespace
    `outpost`?'
  options:
  - id: a
    text: "`- namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: outpost}}`
      and `- podSelector: {matchLabels: {app: drifter}}` as two list entries."
    explanation: 'Two entries mean OR. This allows every pod of `outpost` and every
      pod labelled `app: drifter` in the policy namespace.'
  - id: b
    text: 'One entry that holds `namespaceSelector` for `outpost` and `podSelector`
      for `app: drifter`.'
    explanation: Correct. Selectors inside one entry must both match.
  - id: c
    text: 'One entry with only `podSelector` for `app: drifter`.'
    explanation: This selects pods in the policy namespace, not in `outpost`.
  - id: d
    text: One entry with only `ipBlock` for the Service address.
    explanation: An `ipBlock` is for addresses outside the cluster and does not select
      pods by label.
  correct_option: b
  explanation: A list entry with both selectors is an AND. Two entries are an OR.
    One dash decides.
- id: ats030-010-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Name the port that a policy matches
  source_readings:
  - sections/section-010/module-03/course-02-peer-selectors-ip-blocks-and-ports.md
  prompt: 'A Service exposes port 80 and its `targetPort` is 8080. A policy allows
    ingress to the pods on TCP `port: 80`. A client connects to `http://probe/`. What
    happens?'
  options:
  - id: a
    text: The connection works, because the policy matches the Service port.
    explanation: The policy sees the destination after the Service has translated
      the port.
  - id: b
    text: The connection is blocked, because the policy must name the container port
      8080.
    explanation: Correct. The forwarding rewrites the destination to the pod and its
      port 8080 before the policy filters it.
  - id: c
    text: The connection works, because ports are ignored for namespaced policies.
    explanation: Ports are always enforced when they are listed.
  - id: d
    text: The policy is rejected by the API server for using a Service port.
    explanation: The API server does not compare the port with any Service.
  correct_option: b
  explanation: NetworkPolicy ports describe the traffic that reaches the pod, so use
    the container port.
- id: ats030-010-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Read a timeout and a refusal
  source_readings:
  - sections/section-010/module-01/course-02-traffic-isolation-and-allowed-peers.md
  prompt: 'A client request to a pod ends with `wget: download timed out` after three
    seconds. A second pod answers at once with `Connection refused`. Which statement
    is correct?'
  options:
  - id: a
    text: The timeout usually means a policy dropped the packets. The refusal means
      the pod was reached and no process listens on that port.
    explanation: Correct. A drop gives no reply. A refusal is a reply from the destination.
  - id: b
    text: Both mean a policy blocked the connection.
    explanation: A refusal is sent by the destination host.
  - id: c
    text: The timeout means the process is not running. The refusal means a policy
      denied it.
    explanation: This reverses the two.
  - id: d
    text: Both mean that the Service has no endpoints.
    explanation: With no endpoints the Service rejects or the connection fails differently,
      and a timeout is not proof of that.
  correct_option: a
  explanation: A dropped connection times out. A refused connection shows that the
    destination answered.
- id: ats030-010-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Allow an address range with an exception
  source_readings:
  - sections/section-010/module-03/course-02-peer-selectors-ip-blocks-and-ports.md
  prompt: 'An `ipBlock` has `cidr: 10.0.0.0/8` and `except: [10.1.0.0/16]`. Which
    source address does the rule allow?'
  options:
  - id: a
    text: 10.1.4.7
    explanation: The `except` range is removed from the allowed range.
  - id: b
    text: 192.168.0.5
    explanation: This address is outside the `cidr`.
  - id: c
    text: 10.1.255.255
    explanation: This address is inside the excepted range.
  - id: d
    text: 10.2.4.7
    explanation: Correct. It is inside the `cidr` and outside the `except` range.
  correct_option: d
  explanation: The allowed set is the `cidr` minus every `except` range.
- id: ats030-010-q09
  type: single_choice
  difficulty: beginner
  learning_objective: Explain the need for a network plugin that enforces policies
  source_readings:
  - sections/section-010/module-01/course-01-networkpolicy-and-allowed-connections.md
  prompt: A NetworkPolicy is created and accepted by the API server, but traffic that
    it should block still passes. The cluster network plugin does not implement NetworkPolicy.
    Why can the object exist?
  options:
  - id: a
    text: The API server stores the object. The network plugin enforces it, so without
      enforcement it has no effect.
    explanation: Correct. The resource is only a declaration.
  - id: b
    text: The `kubectl apply` command always enforces the policy on the client.
    explanation: kubectl only sends the object.
  - id: c
    text: The kubelet enforces policies and has a bug.
    explanation: The network plugin enforces policies, not the kubelet.
  - id: d
    text: NetworkPolicy objects are enforced only after a Pod restart.
    explanation: Restarting pods does not install enforcement.
  correct_option: a
  explanation: NetworkPolicy is an API object. A network plugin that supports it must
    turn it into packet filtering.
- id: ats030-010-q10
  type: single_choice
  difficulty: advanced
  learning_objective: Combine ingress and egress rules for one connection
  source_readings:
  - sections/section-010/module-01/course-02-traffic-isolation-and-allowed-peers.md
  prompt: The pod `shuttle` has an egress policy that allows only `probe` on 8080.
    The pod `probe` has an ingress policy that allows only `shuttle` on 8080. `shuttle`
    connects to `probe` on 8080. What is the result?
  options:
  - id: a
    text: The connection works, because both ends allow it.
    explanation: Correct. A connection must be allowed by the egress rules of the
      source and by the ingress rules of the destination, and here both allow it.
  - id: b
    text: The connection is blocked, because egress and ingress rules cancel each
      other.
    explanation: Rules never cancel. They only allow.
  - id: c
    text: The connection works only for the first packet.
    explanation: Return traffic of an allowed connection is permitted, and the connection
      does not stop.
  - id: d
    text: The connection is blocked, because `shuttle` must also be allowed in the
      namespace policy.
    explanation: No extra namespace policy exists.
  correct_option: a
  explanation: Both sides are checked, and each side can only allow. Return traffic
    of an allowed connection is allowed.
