apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: probe-from-drifter
  namespace: starfleet
spec:
  podSelector:
    matchLabels:
      app: probe
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: outpost
      podSelector:
        matchLabels:
          app: drifter
    ports:
    - protocol: TCP
      port: 8080
